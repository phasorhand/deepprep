[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepprep"
version = "0.1.0"
description = "DeepPrep: An LLM-Powered Agentic System for Autonomous Data Preparation (arXiv:2602.07371)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# LLM serving / API clients used by the agent and the LLM judge.
llm = [
    "openai>=1.40",
    "tiktoken>=0.7",
]
# Progressive agentic training (cold-start SFT + multi-turn GRPO).
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "peft>=0.12",
    "datasets>=2.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
deepprep = "deepprep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
